apiVersion: v1
kind: Namespace
metadata:
  name: plainq-system
  labels:
    app.kubernetes.io/name: plainq-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plainq-operator
  namespace: plainq-system
  labels:
    app.kubernetes.io/name: plainq-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plainq-operator
  namespace: plainq-system
  labels:
    app.kubernetes.io/name: plainq-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plainq-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plainq-operator
    spec:
      serviceAccountName: plainq-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/marsolab/plainq-operator:latest
          args:
            - -leader-elect=true
            # Webhooks need a serving certificate. Turn them off only for a
            # local run against a cluster with no cert-manager.
            - -enable-webhooks=true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: webhook
              containerPort: 9443
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            secretName: plainq-operator-webhook-cert
            optional: true
      terminationGracePeriodSeconds: 30
