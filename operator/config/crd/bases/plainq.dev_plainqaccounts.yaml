---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: plainqaccounts.plainq.dev
spec:
  group: plainq.dev
  names:
    categories:
    - plainq
    kind: PlainQAccount
    listKind: PlainQAccountList
    plural: plainqaccounts
    shortNames:
    - pqa
    singular: plainqaccount
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serverRef.name
      name: Server
      type: string
    - jsonPath: .spec.email
      name: Email
      type: string
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PlainQAccount is an account on a PlainQ instance, including the bootstrap
          admin that would otherwise require a browser.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PlainQAccountSpec is the desired state of an account.
            properties:
              bootstrap:
                description: |-
                  Bootstrap creates this account through the onboarding endpoint, which
                  only works for the very first admin and self-closes afterwards.

                  A non-bootstrap account goes through /api/v1/account/signup instead,
                  and that route refuses whenever the target instance has
                  auth.registration disabled — an admin token does not exempt it. The
                  validating webhook rejects that combination rather than letting the
                  reconciler discover it as a 401.
                type: boolean
              credentialsSecretRef:
                description: |-
                  CredentialsSecretRef holds the password. The operator generates one
                  into this Secret when it does not exist, so a password never has to
                  appear in a manifest.
                properties:
                  emailKey:
                    default: email
                    description: EmailKey is the key holding the account email.
                    type: string
                  name:
                    description: Name of the Secret.
                    type: string
                  passwordKey:
                    default: password
                    description: PasswordKey is the key holding the account password.
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy decides whether deleting this object deletes the
                  account.
                enum:
                - Retain
                - Delete
                type: string
              email:
                description: Email identifying the account.
                minLength: 3
                type: string
              role:
                default: user
                description: Role granted to the account.
                type: string
              serverRef:
                description: ServerRef points at the instance that holds the account.
                properties:
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef holds admin credentials for Endpoint. Ignored when
                      Name is set, because the operator already holds that instance's
                      bootstrap credentials.
                    properties:
                      emailKey:
                        default: email
                        description: EmailKey is the key holding the account email.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                      passwordKey:
                        default: password
                        description: PasswordKey is the key holding the account password.
                        type: string
                    required:
                    - name
                    type: object
                  endpoint:
                    description: |-
                      Endpoint is the base URL of a PlainQ HTTP listener the operator does
                      not manage, for example http://plainq.other.svc:8081.
                    type: string
                  name:
                    description: Name of a PlainQ object in the same namespace.
                    type: string
                type: object
            required:
            - email
            - serverRef
            type: object
          status:
            description: PlainQAccountStatus is the observed state of an account.
            properties:
              accountID:
                description: AccountID assigned by the server.
                type: string
              conditions:
                description: Conditions follow the Kubernetes convention.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
