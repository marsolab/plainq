                              pod's ambient identity (IRSA, workload identity, instance role).
                            properties:
                              accessKeyIDKey:
                                default: access-key-id
                                description: AccessKeyIDKey is the key holding the
                                  access key ID.
                                type: string
                              name:
                                description: Name of the Secret.
                                type: string
                              secretAccessKeyKey:
                                default: secret-access-key
                                description: SecretAccessKeyKey is the key holding
                                  the secret access key.
                                type: string
                              sessionTokenKey:
                                description: SessionTokenKey is the key holding an
