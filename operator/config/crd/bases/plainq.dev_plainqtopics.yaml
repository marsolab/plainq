                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
              subscriptions:
                description: Subscriptions currently established.
                items:
                  description: SubscriptionStatus is one established subscription.
                  properties:
                    queue:
                      description: |-
                        Queue is the PlainQQueue object name, when the subscription came from
                        a reference rather than a raw ID.
                      type: string
                    queueID:
                      description: QueueID on the server.
                      type: string
                    ready:
                      description: Ready reports that the subscription is established.
                      type: boolean
                    subscriptionID:
                      description: SubscriptionID assigned by the server.
                      type: string
                  type: object
                type: array
              topicID:
                description: TopicID assigned by the server.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
