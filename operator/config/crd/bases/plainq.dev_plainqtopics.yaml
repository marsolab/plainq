---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: plainqtopics.plainq.dev
spec:
  group: plainq.dev
  names:
    categories:
    - plainq
    kind: PlainQTopic
    listKind: PlainQTopicList
    plural: plainqtopics
    shortNames:
    - pqt
    singular: plainqtopic
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serverRef.name
      name: Server
      type: string
    - jsonPath: .status.topicID
      name: Topic ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PlainQTopic is a topic and its subscriptions on a PlainQ instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PlainQTopicSpec is the desired state of a topic and its fan-out.
            properties:
              deletionPolicy:
                default: Retain
                description: DeletionPolicy decides whether deleting this object deletes
                  the topic.
                enum:
                - Retain
                - Delete
                type: string
              serverRef:
                description: ServerRef points at the instance that holds the topic.
                properties:
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef holds admin credentials for Endpoint. Ignored when
                      Name is set, because the operator already holds that instance's
                      bootstrap credentials.
                    properties:
                      emailKey:
                        default: email
                        description: EmailKey is the key holding the account email.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                      passwordKey:
                        default: password
                        description: PasswordKey is the key holding the account password.
                        type: string
                    required:
                    - name
                    type: object
                  endpoint:
                    description: |-
                      Endpoint is the base URL of a PlainQ HTTP listener the operator does
                      not manage, for example http://plainq.other.svc:8081.
                    type: string
                  name:
                    description: Name of a PlainQ object in the same namespace.
                    type: string
                type: object
              subscriptions:
                description: |-
                  Subscriptions are reconciled as a set: entries here are subscribed,
                  entries on the server but absent here are unsubscribed.
                items:
                  description: |-
                    TopicSubscription routes published messages into a queue. Exactly one of
                    QueueRef or QueueID must be set.
                  properties:
                    queueID:
                      description: QueueID names a queue the operator does not manage.
                      type: string
                    queueRef:
                      description: QueueRef names a PlainQQueue in the same namespace.
                      properties:
                        name:
                          description: Name of the referenced object.
                          type: string
                      required:
                      - name
                      type: object
                  type: object
                type: array
              topicName:
                description: TopicName on the server. Defaults to metadata.name. Immutable.
