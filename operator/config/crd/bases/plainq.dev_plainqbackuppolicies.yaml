---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: plainqbackuppolicies.plainq.dev
spec:
  group: plainq.dev
  names:
    categories:
    - plainq
    kind: PlainQBackupPolicy
    listKind: PlainQBackupPolicyList
    plural: plainqbackuppolicies
    shortNames:
    - pqbp
    singular: plainqbackuppolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serverRef.name
      name: Server
      type: string
    - jsonPath: .spec.schedule.cron
      name: Schedule
      type: string
    - jsonPath: .status.lastSuccessfulBackup
      name: Last Success
      type: date
    - jsonPath: .status.backupsRetained
      name: Retained
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PlainQBackupPolicy is a backup regime for one PlainQ instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PlainQBackupPolicySpec is the desired backup regime for one
              instance.
            properties:
              compression:
                default: zstd
                description: Compression applied before upload.
                enum:
                - none
                - gzip
                - zstd
                type: string
              continuous:
                description: Continuous configures WAL shipping through a Litestream
                  sidecar.
                properties:
                  enabled:
                    description: Enabled injects the Litestream sidecar.
                    type: boolean
                  resources:
                    description: Resources for the sidecar.
                    properties:
                      limits:
                        additionalProperties:
                          type: string
                        description: Limits for the container.
                        type: object
                      requests:
                        additionalProperties:
                          type: string
                        description: Requests for the container.
                        type: object
                    type: object
                  snapshotInterval:
                    default: 1h
                    description: SnapshotInterval between full snapshots at the destination.
                    type: string
                  syncInterval:
                    default: 10s
                    description: SyncInterval between WAL pushes. This is the practical
                      RPO.
                    type: string
                type: object
              destination:
                description: Destination is where artifacts are written.
                properties:
                  filesystem:
                    description: Filesystem writes to a PersistentVolume.
                    properties:
                      claimTemplate:
                        description: ClaimTemplate creates the claim instead of adopting
                          one.
                        properties:
                          accessModes:
                            description: AccessModes for the claim.
                            items:
                              type: string
                            type: array
                          annotations:
                            additionalProperties:
                              type: string
                            description: Annotations added to the claim.
                            type: object
                          size:
                            default: 8Gi
                            description: Size of the volume.
                            type: string
                          storageClassName:
                            description: StorageClassName selects the class. Empty
                              uses the cluster default.
                            type: string
                        type: object
                      existingClaim:
                        description: |-
                          ExistingClaim names a PersistentVolumeClaim to write into. Prefer
                          ReadWriteMany so restore Jobs can be scheduled anywhere.
                        type: string
                      path:
                        description: Path is the directory prefix within the volume.
                        type: string
                    type: object
                  s3:
                    description: S3 writes to S3-compatible object storage.
                    properties:
                      bucket:
                        description: Bucket that holds the artifacts.
                        type: string
                      caBundleSecretRef:
                        description: CABundleSecretRef holds a CA bundle for a private-CA
                          endpoint.
                        properties:
                          key:
                            description: Key within the Secret.
                            type: string
                          name:
                            description: Name of the Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      credentialsSecretRef:
                        description: |-
                          CredentialsSecretRef holds static credentials. Omit it to use the
                          pod's ambient identity (IRSA, workload identity, instance role).
                        properties:
                          accessKeyIDKey:
                            default: access-key-id
                            description: AccessKeyIDKey is the key holding the access
                              key ID.
                            type: string
                          name:
                            description: Name of the Secret.
                            type: string
                          secretAccessKeyKey:
                            default: secret-access-key
                            description: SecretAccessKeyKey is the key holding the
                              secret access key.
                            type: string
                          sessionTokenKey:
                            description: SessionTokenKey is the key holding an optional
                              session token.
                            type: string
                        required:
                        - name
                        type: object
                      endpoint:
                        description: |-
                          Endpoint is the S3 API endpoint. Empty means the AWS endpoint derived
                          from Region.
                        type: string
                      forcePathStyle:
                        description: |-
                          ForcePathStyle addresses the bucket as a path segment rather than a
                          virtual host. MinIO and most self-hosted gateways need it.
                        type: boolean
                      insecureSkipVerify:
                        description: |-
                          InsecureSkipVerify disables TLS verification. It exists for lab
                          clusters; it should never be set against anything that matters.
                        type: boolean
                      kmsKeyID:
                        description: KMSKeyID names the key when ServerSideEncryption
                          is aws:kms.
                        type: string
                      prefix:
                        description: Prefix is the key prefix within the bucket.
                        type: string
                      region:
                        description: Region of the bucket.
                        type: string
                      serverSideEncryption:
                        description: ServerSideEncryption requests SSE, for example
                          AES256 or aws:kms.
                        type: string
                      storageClass:
                        description: StorageClass for uploaded objects, for example
                          STANDARD_IA.
                        type: string
                    required:
                    - bucket
                    type: object
                type: object
              encryption:
                description: Encryption at rest, on top of whatever the destination
                  does.
                properties:
                  enabled:
                    description: Enabled turns on encryption.
                    type: boolean
                  secretRef:
                    description: SecretRef holds the age identity used to encrypt
                      and decrypt.
                    properties:
                      key:
                        description: Key within the Secret.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
              podTemplate:
                description: PodTemplate carries scheduling constraints for backup
                  Jobs.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations for backup Job pods.
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    description: Labels for backup Job pods.
                    type: object
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: NodeSelector for backup Jobs.
                    type: object
                type: object
              resources:
                description: Resources for the backup agent and Jobs.
                properties:
                  limits:
                    additionalProperties:
                      type: string
                    description: Limits for the container.
                    type: object
                  requests:
                    additionalProperties:
                      type: string
                    description: Requests for the container.
                    type: object
                type: object
              retention:
                description: Retention prunes artifacts and the PlainQBackup objects
                  naming them.
                properties:
                  keepDaily:
                    description: KeepDaily retains the newest backup of each of the
                      last N days.
                    format: int32
                    type: integer
                  keepLast:
                    description: KeepLast retains the N most recent backups.
                    format: int32
                    type: integer
                  keepMonthly:
                    description: KeepMonthly retains the newest backup of each of
                      the last N months.
                    format: int32
                    type: integer
                  keepWeekly:
                    description: KeepWeekly retains the newest backup of each of the
                      last N weeks.
                    format: int32
                    type: integer
                  maxAge:
                    description: MaxAge deletes anything older, regardless of the
                      tiers above.
                    type: string
                type: object
              schedule:
                description: Schedule configures periodic whole-database backups.
                properties:
                  concurrencyPolicy:
                    default: Forbid
                    description: ConcurrencyPolicy for overlapping runs.
                    enum:
                    - Allow
                    - Forbid
                    - Replace
                    type: string
                  cron:
                    description: Cron expression in standard five-field form.
                    type: string
                  enabled:
                    description: Enabled renders the CronJob.
                    type: boolean
                  engine:
                    default: Online
                    description: Engine used for each run.
                    enum:
                    - Online
                    - VolumeSnapshot
                    - PostgresDump
                    - Litestream
                    type: string
                  sourceSyncTimeout:
                    default: 2m
                    description: |-
                      SourceSyncTimeout bounds how long the operator waits for the chosen
                      source node to apply the leader's committed log before copying.

                      A reachable follower can lag while the cluster still reports healthy:
                      ClusterStatus.Healthy is leader-present plus reachable-voter quorum
                      and says nothing about applied index. Copying such a node produces an
                      artifact that silently omits acknowledged writes.
                    type: string
                  startingDeadlineSeconds:
                    description: StartingDeadlineSeconds before a missed run is abandoned.
                    format: int64
                    type: integer
                  suspend:
                    description: Suspend pauses the schedule without deleting it.
                    type: boolean
                  timeZone:
                    description: TimeZone the expression is evaluated in.
                    type: string
                  timeout:
                    default: 1h
                    description: Timeout for one run.
                    type: string
                type: object
              serverRef:
                description: ServerRef points at the instance to back up.
                properties:
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef holds admin credentials for Endpoint. Ignored when
                      Name is set, because the operator already holds that instance's
                      bootstrap credentials.
                    properties:
                      emailKey:
                        default: email
                        description: EmailKey is the key holding the account email.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                      passwordKey:
                        default: password
                        description: PasswordKey is the key holding the account password.
                        type: string
                    required:
                    - name
                    type: object
                  endpoint:
                    description: |-
                      Endpoint is the base URL of a PlainQ HTTP listener the operator does
                      not manage, for example http://plainq.other.svc:8081.
                    type: string
                  name:
                    description: Name of a PlainQ object in the same namespace.
                    type: string
                type: object
              source:
                description: Source selects which cluster node backups are taken from.
                properties:
                  prefer:
                    default: NonVoter
                    description: Prefer decides the selection order.
                    enum:
                    - NonVoter
                    - Follower
                    - Any
                    type: string
                type: object
              verify:
                default: Checksum
                description: Verify decides how hard the operator tries to prove readability.
                enum:
                - None
                - Checksum
                - Restore
                type: string
            required:
            - destination
            - serverRef
            type: object
          status:
            description: PlainQBackupPolicyStatus is the observed state of a backup
              regime.
            properties:
              backupsRetained:
                description: BackupsRetained is how many artifacts survive retention.
                format: int32
                type: integer
              conditions:
                description: Conditions follow the Kubernetes convention.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              continuous:
                description: Continuous reports on WAL shipping.
                properties:
                  healthy:
                    description: Healthy reports whether replication is keeping up.
                    type: boolean
                  lag:
                    description: Lag behind the primary.
                    type: string
                  lastSync:
                    description: LastSync timestamp.
                    format: date-time
                    type: string
                type: object
              lastBackup:
                description: LastBackup summarizes the most recent run, successful
                  or not.
                properties:
                  name:
                    description: Name of the PlainQBackup.
                    type: string
                  result:
                    description: Result of the backup.
                    type: string
                  time:
                    description: Time the backup completed.
                    format: date-time
                    type: string
                type: object
              lastSuccessfulBackup:
                description: LastSuccessfulBackup is when a run last completed successfully.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
              totalSize:
                description: TotalSize of retained artifacts.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
