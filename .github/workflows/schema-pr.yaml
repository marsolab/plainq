name: Pull Request | Merge

on:
  # Only pull requests. This used to carry a bare `push:` as well, with no
  # branch or path filter, so every push to every branch ran these jobs -- and
  # a PR branch ran them twice, once for the push and once for the pull
  # request. Pushes to main are already covered by schema-release.yaml, which
  # lints and breaking-checks before it publishes.
  pull_request:
    branches:
      - main
    paths:
      - 'schema/**'
      - 'internal/server/schema/**'
      - 'scripts/check-schema-*.sh'
      - 'Makefile'
      - '.github/workflows/schema-pr.yaml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-lint-action@v1
        with:
          input: schema
      - name: Generate local schema artifacts
        run: make schema-local
      - name: Check schema lint exception scope
        run: ./scripts/check-schema-lint-scope.sh
      - name: Test schema lint guard without ripgrep
        run: ./scripts/check-schema-lint-scope_test.sh
      - name: Test schema publication head guard
        run: ./scripts/check-schema-publish-head_test.sh
      - name: Check tracked generated artifacts
        run: git diff --exit-code -- schema/docs internal/server/schema
      - name: Check public SDK generation
        run: ./scripts/check-schema-generation.sh
      - name: Test schema compatibility
        run: go test ./internal/server/schema/... -count=1

  breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      # github.repository, not ${GITHUB_REPOSITORY}: Actions only interpolates
      # ${{ }}, so the old form reached buf verbatim and only resolved because
      # the action happens to pass it through a shell, where the runner env var
      # expands. That is an accident, not a contract.
      - uses: bufbuild/buf-breaking-action@v1
        with:
          input: schema
          against: "https://github.com/${{ github.repository }}.git#branch=main,subdir=schema"
