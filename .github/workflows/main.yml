name: Merge to Main

on:
  push:
    paths-ignore:
      - internal/houston/ui
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-go@v5
        with:
          go-version: '^1.26'

      - name: build houston ui
        run: make houston

      - name: typecheck houston (astro check)
        working-directory: internal/houston/ui
        run: bun run check

      - name: go tests
        run: go test -cover ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-go@v5
        with:
          go-version: '^1.26'

      - name: build houston ui
        run: make houston

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=3m

  # The operator is a separate Go module, so the jobs above do not reach it:
  # `go test ./...` and golangci-lint both operate on one module at a time.
  operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '^1.26'

      - name: check generated manifests are current
        working-directory: operator
        run: |
          make generate manifests
          git diff --exit-code -- api config

      - name: go tests
        working-directory: operator
        run: go test -cover ./...

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: operator
          args: --timeout=5m
