name: Merge

on:
  # The schema is published when a change to it lands on main. This used to
  # trigger on `release: published`, but the repository has never cut a
  # release, so the workflow never ran once and the registry drifted behind
  # main until someone pushed by hand.
  push:
    branches:
      - main
    paths:
      - 'schema/**'
      - 'internal/server/schema/**'
      - 'scripts/check-schema-generation.sh'
      - 'Makefile'
      - '.github/workflows/schema-release.yaml'

  # Lets the schema be republished without a commit, e.g. after rotating
  # BUF_TOKEN or recovering from a failed push.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-lint-action@v1
        with:
          input: schema
      - name: Generate local schema artifacts
        run: make schema-local
      - name: Check tracked generated artifacts
        run: git diff --exit-code -- schema/docs internal/server/schema
      - name: Check public SDK generation
        run: ./scripts/check-schema-generation.sh
      - name: Test schema compatibility
        run: go test ./internal/server/schema/... -count=1

  breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      # Checked against what is actually published, not against main. This
      # job now runs on main, so comparing against main would compare the
      # commit with itself and pass unconditionally. The registry is the
      # baseline that protects consumers.
      - uses: bufbuild/buf-breaking-action@v1
        with:
          input: schema
          against: buf.build/plainq/schema

  # Append-only publish. Never delete/recreate buf.build/plainq/schema or
  # rewrite labels so existing consumer pins stop resolving — fix forward only.
  push:
    runs-on: ubuntu-latest
    needs: [breaking, lint]
    outputs:
      server_git_sha: ${{ steps.publish.outputs.server_git_sha }}
      schema_bsr_commit: ${{ steps.publish.outputs.schema_bsr_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - name: Publish and resolve immutable schema commit
        id: publish
        shell: bash
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${BUF_TOKEN:-}"
          server_git_sha="${GITHUB_SHA:?GITHUB_SHA is required}"
          case "$server_git_sha" in
            (*[!0-9a-f]*|'') echo "invalid server git SHA" >&2; exit 1 ;;
          esac
          test "${#server_git_sha}" -eq 40
          bsr_label="git-${server_git_sha}"
          buf push schema \
            --label main \
            --label "$bsr_label" \
            --source-control-url "https://github.com/marsolab/plainq/commit/${server_git_sha}"
          schema_bsr_commit="$(buf registry module commit resolve \
            "buf.build/plainq/schema:${bsr_label}" --format json | jq -er '.commit')"
          case "$schema_bsr_commit" in
            (*[!0-9a-f]*|'') echo "invalid BSR commit" >&2; exit 1 ;;
          esac
          test "${#schema_bsr_commit}" -eq 32
          test "$(buf registry module commit resolve buf.build/plainq/schema:main \
            --format json | jq -er '.commit')" = "$schema_bsr_commit"
          {
            printf 'server_git_sha=%s\n' "$server_git_sha"
            printf 'schema_bsr_commit=%s\n' "$schema_bsr_commit"
          } >> "$GITHUB_OUTPUT"
          {
            printf 'PLAINQ_SCHEMA_GIT_SHA=%s\n' "$server_git_sha"
            printf 'PLAINQ_SCHEMA_BSR_COMMIT=%s\n' "$schema_bsr_commit"
          } > "$RUNNER_TEMP/plainq-schema-pin.env"
      - name: Upload immutable SDK handoff
        uses: actions/upload-artifact@v4
        with:
          name: plainq-schema-pin-${{ github.sha }}
          path: ${{ runner.temp }}/plainq-schema-pin.env
          if-no-files-found: error
          retention-days: 90
