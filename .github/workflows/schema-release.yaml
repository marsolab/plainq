name: Merge

on:
  # The schema is published when a change to it lands on main. This used to
  # trigger on `release: published`, but the repository has never cut a
  # release, so the workflow never ran once and the registry drifted behind
  # main until someone pushed by hand.
  push:
    branches:
      - main
    paths:
      - 'schema/**'
      - 'internal/server/schema/**'
      - 'Makefile'
      - 'go.mod'
      - '.github/workflows/schema-release.yaml'

  # Lets the schema be republished without a commit, e.g. after rotating
  # BUF_TOKEN or recovering from a failed push.
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      schema_changed: ${{ steps.schema.outputs.schema_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: detect schema changes in pushed commit range
        id: schema
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "schema_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$BEFORE"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git hash-object -t tree /dev/null)"
          fi

          if git diff --quiet "$base" "$AFTER" -- schema; then
            echo "schema_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "schema_changed=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - uses: bufbuild/buf-lint-action@v1
        with:
          input: schema

  breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      # Checked against what is actually published, not against main. This
      # job now runs on main, so comparing against main would compare the
      # commit with itself and pass unconditionally. The registry is the
      # baseline that protects consumers.
      - uses: bufbuild/buf-breaking-action@v1
        with:
          input: schema
          against: buf.build/plainq/schema

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: regenerate bindings, clients, validation, Connect, and docs
        run: make schema-check

  # Append-only publish. Never delete/recreate buf.build/plainq/schema or
  # rewrite labels so existing consumer pins stop resolving — fix forward only.
  push:
    runs-on: ubuntu-latest
    needs:
      - changes
      - generated
      - breaking
      - lint
    if: >-
      ${{ needs.lint.result == 'success' && needs.breaking.result == 'success' && needs.generated.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.schema_changed == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - uses: bufbuild/buf-push-action@v1
        with:
          input: schema
          buf_token: ${{ secrets.BUF_TOKEN }}
          create_visibility: public
          draft: false
