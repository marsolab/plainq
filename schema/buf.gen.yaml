version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: go
    opt: paths=source_relative

  - remote: buf.build/community/planetscale-vtprotobuf:v0.6.0
    out: go
    opt:
      - paths=source_relative
      - features=marshal+unmarshal+size+pool+clone+equal

  - remote: buf.build/grpc/go:v1.6.2
    out: go
    opt: paths=source_relative

  - remote: buf.build/connectrpc/go:v1.20.0
    out: go
    opt: paths=source_relative

  - remote: buf.build/bufbuild/validate-go:v1.3.3
    out: go
    opt: paths=source_relative

  - remote: buf.build/community/mitchellh-go-json:v1.1.0
    out: go
    opt: paths=source_relative

  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: docs
