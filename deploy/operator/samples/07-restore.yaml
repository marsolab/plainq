# Restores.
#
# The default strategy is NewInstance, and it is the one to reach for when
# something has gone wrong: it leaves the damaged instance untouched, so you
# can compare the two and cut over with a Service edit rather than betting the
# only copy of your data on a command working the first time.
---
apiVersion: plainq.dev/v1alpha1
kind: PlainQRestore
metadata:
  name: orders-recovery
  namespace: plainq
spec:
  source:
    backupRef:
      name: orders-20260725-0300

  target:
    strategy: NewInstance
    newInstance:
      name: orders-restored
      # Inherits the source instance's spec. Override anything you want
      # different — a smaller volume for a verification run, say.
      spec:
        pod:
          resources:
            requests:
              cpu: 200m
              memory: 256Mi

  # Re-apply the PlainQQueue and PlainQTopic objects against the restored
  # instance once it is serving. A restored instance mints new queue IDs; this
  # is why references are by object name.
  recreateResources: true
---
# Point-in-time restore, in place, from a policy with continuous replication.
#
# InPlace overwrites a live database. It requires allowDataLoss and it should
# be a deliberate decision, not a reflex: the operator scales the instance to
# zero, replaces the database, wipes the consensus data directory so a stale
# Raft log cannot resurrect old state, brings one node up with bootstrap, and
# lets the rest rejoin and pull a fresh snapshot.
apiVersion: plainq.dev/v1alpha1
kind: PlainQRestore
metadata:
  name: orders-pitr
  namespace: plainq
spec:
  source:
    policyRef:
      name: orders-backups
    pointInTime: "2026-07-25T14:32:00Z"

  target:
    strategy: InPlace
    inPlace:
      plainqRef:
        name: orders

  allowDataLoss: true
  recreateResources: false
---
# Restoring an artifact the operator did not create — a file copied in from
# another cluster, or one whose PlainQBackup object has been garbage collected.
apiVersion: plainq.dev/v1alpha1
kind: PlainQRestore
metadata:
  name: orders-import
  namespace: plainq
spec:
  source:
    location: s3://plainq-backups/prod/orders/2026/07/20/orders-20260720-0300.db.zst
    destination:
      s3:
        endpoint: https://s3.us-east-1.amazonaws.com
        region: us-east-1
        bucket: plainq-backups
        credentialsSecretRef:
          name: backup-s3
          accessKeyIDKey: access-key-id
          secretAccessKeyKey: secret-access-key
  target:
    strategy: NewInstance
    newInstance:
      name: orders-imported
