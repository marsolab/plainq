{{- if .Values.auth.enabled }}
{{- if not .Values.auth.existingSecret }}
{{- if not .Values.auth.jwtSecret }}
{{- fail "auth.enabled is true but no JWT secret was provided. Set auth.jwtSecret, or point auth.existingSecret at a pre-created Secret (recommended for production)." }}
{{- end }}
{{- if lt (len .Values.auth.jwtSecret) 32 }}
{{- fail "auth.jwtSecret must be at least 32 bytes" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-auth" (include "plainq.fullname" .) }}
  labels:
    {{- include "plainq.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.jwtSecret | quote }}
{{- end }}
{{- if not .Values.auth.bootstrap.existingSecret }}
{{- if not .Values.auth.bootstrap.secret }}
{{- fail "auth.enabled is true but no bootstrap secret was provided. Set auth.bootstrap.secret, or point auth.bootstrap.existingSecret at a pre-created Secret (recommended for production)." }}
{{- end }}
{{- if lt (len .Values.auth.bootstrap.secret) 32 }}
{{- fail "auth.bootstrap.secret must be at least 32 bytes" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-bootstrap" (include "plainq.fullname" .) }}
  labels:
    {{- include "plainq.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.bootstrap.secretKey }}: {{ .Values.auth.bootstrap.secret | quote }}
{{- end }}
{{- end }}
{{- if .Values.agent.enabled }}
{{- if not .Values.agent.auth.existingSecret }}
{{- if not .Values.agent.auth.jwtSecret }}
{{- fail "agent.enabled is true but no agent JWT secret was provided. Set agent.auth.jwtSecret, or point agent.auth.existingSecret at a pre-created Secret." }}
{{- end }}
{{- if lt (len .Values.agent.auth.jwtSecret) 32 }}
{{- fail "agent.auth.jwtSecret must be at least 32 bytes" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-agent-auth" (include "plainq.fullname" .) }}
  labels:
    {{- include "plainq.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.agent.auth.secretKey }}: {{ .Values.agent.auth.jwtSecret | quote }}
{{- end }}
{{- if and (not .Values.agent.developmentInsecureTransport) (not .Values.agent.tls.existingSecret) }}
{{- fail "agent.enabled requires agent.tls.existingSecret unless loopback-only developmentInsecureTransport is selected" }}
{{- end }}
{{- if and .Values.agent.developmentInsecureTransport .Values.cluster.enabled }}
{{- fail "agent.developmentInsecureTransport cannot be used with clustering" }}
{{- end }}
{{- end }}
{{- if and (eq .Values.storage.driver "postgres") (not .Values.storage.postgres.existingSecret) }}
{{- if not .Values.storage.postgres.dsn }}
{{- fail "storage.driver is postgres but no DSN was provided. Set storage.postgres.dsn, or point storage.postgres.existingSecret at a pre-created Secret (recommended for production)." }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-postgres" (include "plainq.fullname" .) }}
  labels:
    {{- include "plainq.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.storage.postgres.secretKey }}: {{ .Values.storage.postgres.dsn | quote }}
{{- end }}
