{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "plainq.serviceAccountName" . }}
  labels:
    {{- include "plainq.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if include "plainq.needsServiceAccountToken" . }}
# Kubernetes discovery reads the API with this account, so the token has to be
# mountable regardless of the chart-wide default.
automountServiceAccountToken: true
{{- else }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
